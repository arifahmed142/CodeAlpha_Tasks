
{% extends "resource/base.html" %}

{% block title %}
Login Session
{% endblock title %}

{% block heading %}
<p class="text-2xl font-bold text-slate-800">Welcome Back</p>
<p class="text-sm text-slate-500 mt-2">Login to continue to your account</p>
{% endblock heading %}

{% block content %}

<div class="w-full max-w-md mx-auto px-5 pb-8">

    <form action="" method="post" class="space-y-6">

        {% csrf_token %}

        <div>
            <label for="username" class="block text-sm font-semibold text-slate-700 mb-2">
                Username
            </label>

            <input
                type="text"
                name="username"
                id="username"
                placeholder="Enter your username"
                class="w-full h-12 px-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition duration-200"
                required
            >
        </div>

        <div>
            <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">
                Password
            </label>

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter your password"
                class="w-full h-12 px-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition duration-200"
                required
            >
        </div>

        <div class="flex items-center gap-3 pt-2">

            <button
                type="reset"
                class="w-1/3 h-12 rounded-xl border border-slate-300 text-slate-600 font-semibold hover:bg-slate-100 transition duration-200"
            >
                Reset
            </button>

            <button
                type="submit"
                class="flex-1 h-12 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 shadow-md shadow-blue-200 transition duration-200"
            >
                Login →
            </button>

        </div>

        <div class="relative flex items-center py-2">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="px-4 text-sm text-slate-400">New to our platform?</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <a
            href="{% url 'Register' %}"
            class="flex items-center justify-center w-full h-12 rounded-xl border-2 border-blue-600 text-blue-600 font-semibold hover:bg-blue-50 transition duration-200"
        >
            Create an Account
        </a>

    </form>

</div>

{% endblock content %}
